name: Deploy to GitHub Pages

# Free GitHub account: repo must be PUBLIC. Settings → Pages → branch gh-pages / (root)
# Live URL: https://yunusbashashaik.github.io/Global-Stores/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client for GitHub Pages
        run: npm run build -w client
        env:
          VITE_BASE_PATH: /Global-Stores/

      - name: SPA fallback for client-side routes
        run: cp client/dist/index.html client/dist/404.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: gh-pages
