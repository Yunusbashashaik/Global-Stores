name: Deploy to GitHub Pages

# https://yunusbashashaik.github.io/Global-Stores/
# Pages setting: gh-pages branch, /(root) OR /docs — workflow publishes both.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "index.html"
      - "404.html"
      - "logo.svg"
      - "Global_bg.JPG"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build client
        run: npm run build -w client
        env:
          VITE_BASE_PATH: /Global-Stores/

      - name: SPA fallback + Jekyll bypass
        run: |
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll

      - name: Publish static site on main (root + docs)
        run: |
          rm -rf docs assets
          mkdir -p docs
          cp -r client/dist/. docs/
          cp client/dist/index.html ./index.html
          cp client/dist/404.html ./404.html
          cp client/dist/logo.svg ./logo.svg
          cp client/dist/Global_bg.JPG ./Global_bg.JPG
          cp -r client/dist/assets ./assets
          cp client/dist/.nojekyll ./.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs index.html 404.html logo.svg Global_bg.JPG assets .nojekyll
          git diff --staged --quiet && exit 0
          git commit -m "chore: deploy site [skip ci]"
          git push

      - name: Stage gh-pages payload (root + docs)
        run: |
          rm -rf .gh-pages-publish
          mkdir -p .gh-pages-publish/docs
          cp -r client/dist/. .gh-pages-publish/
          cp -r client/dist/. .gh-pages-publish/docs/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.gh-pages-publish
          publish_branch: gh-pages
